<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEC EDGAR GPT Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
  .header { padding: 16px 20px; background: #16213e; border-bottom: 1px solid #0f3460; font-size: 18px; font-weight: 600; }
  .header span { color: #e94560; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #0f3460; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #16213e; border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; color: #888; font-size: 12px; }
  .input-area { padding: 16px 20px; background: #16213e; border-top: 1px solid #0f3460; display: flex; gap: 10px; }
  .input-area textarea { flex: 1; background: #1a1a2e; color: #eee; border: 1px solid #0f3460; border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; resize: none; height: 44px; outline: none; }
  .input-area textarea:focus { border-color: #e94560; }
  .input-area button { background: #e94560; color: #fff; border: none; border-radius: 8px; padding: 0 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .input-area button:hover { background: #c73652; }
  .input-area button:disabled { background: #555; cursor: not-allowed; }
  .typing { align-self: flex-start; color: #888; font-size: 13px; }
</style>
</head>
<body>
<div class="header">SEC EDGAR <span>GPT-124M</span> Chat</div>
<div class="messages" id="messages">
  <div class="msg system">Ask me anything about SEC filings. Model: sec-edgar-gpt-124m</div>
</div>
<div class="input-area">
  <textarea id="input" placeholder="Type a message..." rows="1"></textarea>
  <button id="send" onclick="send()">Send</button>
</div>

<script>
const API = window.location.protocol + '//' + window.location.host + '/v1/chat/completions';
const msgs = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let history = [];

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = '44px';

  addMsg('user', text);
  history.push({ role: 'user', content: text });

  sendBtn.disabled = true;
  const typingEl = addMsg('typing', 'Thinking...');

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, max_tokens: 200, temperature: 0.7 })
    });
    const data = await res.json();
    typingEl.remove();
    const reply = data.choices?.[0]?.message?.content || '[No response]';
    addMsg('assistant', reply);
    history.push({ role: 'assistant', content: reply });
  } catch (err) {
    typingEl.remove();
    addMsg('system', 'Error: ' + err.message);
  }
  sendBtn.disabled = false;
  input.focus();
}

// auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = '44px';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
